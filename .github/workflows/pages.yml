name: Deploy The Brief review site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the approved output
        uses: actions/checkout@v4

      - name: Prepare the exact publication allowlist
        shell: bash
        run: |
          mkdir _site
          cp index.html the-wheel.html ma-screeners.html sp-500-overview.html tools.html disclaimers.html _site/
          cp options-risk-disclosure.pdf .nojekyll _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the approved site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
